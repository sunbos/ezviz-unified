<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLV 测试片预览</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Source Sans 3", "PingFang SC", system-ui, -apple-system,
      "Segoe UI", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
    background: #f5f6f8;
    color: #1f2328;
  }
  .preview {
    width: min(100%, 60rem);
    margin: 0 auto;
    padding: 1rem;
  }
  h1 { font-size: 1.5rem; margin: 0.5rem 0; }
  .hint { margin: 0.25rem 0 1rem; color: #57606a; }
  #player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 0.5rem;
    overflow: hidden;
  }
  #player iframe { display:block; width:100%; height:100%; border:0; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin: 1rem 0;
  }
  button {
    font: inherit;
    min-height: 2.75rem;
    padding: 0.5rem 1.25rem;
    border: 1px solid #8c959f;
    border-radius: 0.375rem;
    background: #ffffff;
    color: #1f2328;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #eef1f4; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  :focus-visible {
    outline: 3px solid #1a73e8;
    outline-offset: 2px;
  }
  #status { margin: 0.5rem 0; font-size: 0.95rem; }
  #status[data-state="playing"] { color: #137333; }
  #status[data-state="error"] { color: #b3261e; font-weight: 600; }
</style>
<script src="/preview.js" defer></script>
</head>
<body>
<main class="preview">
  <h1>FLV 测试片预览</h1>
  <p class="hint">播放本机生成的 H.264/FLV 测试片。</p>
  <div id="player" role="region" aria-label="FLV 测试片画面"></div>
  <div class="controls">
    <button id="play-preview" type="button" aria-controls="player">播放预览</button>
    <button id="stop-preview" type="button" aria-controls="player" disabled>停止预览</button>
  </div>
  <p id="status" data-state="idle" role="status" aria-live="polite">状态：空闲</p>
  <noscript><p>需要启用 JavaScript 才能播放预览。</p></noscript>
</main>
</body>
</html>
