<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地 HLS 预览示例</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/vendor/style/css.css">
  <style>
    :root {
      color-scheme: light;
      background: #f7f8fa;
      color: #18232e;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Source Sans 3", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.6;
    }
    header, main {
      width: 100%;
      max-width: 52rem;
      margin-inline: auto;
      padding-inline: 1rem;
    }
    header h1 {
      margin: 1.5rem 0 0.25rem;
      font-size: 1.5rem;
    }
    header p {
      margin: 0 0 1.25rem;
    }
    main {
      padding-bottom: 2rem;
    }
    #player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 0.5rem;
      overflow: hidden;
    }
    #player video {
      display: block;
      width: 100%;
      height: 100%;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .controls button {
      flex: 1 1 9rem;
      min-height: 2.75rem;
      padding: 0.5rem 1.25rem;
      font-size: 1rem;
      color: inherit;
      background: transparent;
      border: 1px solid currentColor;
      border-radius: 0.375rem;
      cursor: pointer;
    }
    .controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin: 0.75rem 0 0;
      min-height: 1.5rem;
    }
    #status[data-state="playing"] {
      color: #1a7f37;
    }
    #status[data-state="failed"] {
      color: #b3261e;
    }
  </style>
  <script defer src="/vendor/index.umd.js"></script>
  <script defer src="/preview.js"></script>
</head>
<body>
  <header>
    <h1>本地 HLS 预览</h1>
    <p>使用萤石官方 HLS 播放器播放本机生成的 H.264 测试片。</p>
  </header>
  <main>
    <div id="player" role="region" aria-label="视频播放区域"></div>
    <div class="controls">
      <button id="play-preview" type="button" aria-controls="player">播放</button>
      <button id="stop-preview" type="button" aria-controls="player" disabled>停止</button>
    </div>
    <p id="status" data-state="idle" role="status" aria-live="polite">空闲</p>
  </main>
</body>
</html>
